<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosikgram - Telegram Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- AUTH MODAL -->
    <div class="auth-modal" id="auth-modal">
        <div class="auth-card">
            <div class="auth-header">
                <h2 id="auth-title">Telegram</h2>
                <p class="auth-subtitle">Отправляй сообщения, делись мыслями</p>
            </div>
            <div class="auth-form">
                <input type="text" id="username-input" placeholder="Никнейм" maxlength="15" autocomplete="off">
                <input type="password" id="password-input" placeholder="Пароль" autocomplete="off">
                <div id="error-msg" class="error-msg"></div>
                <button id="submit-btn" class="btn-primary" onclick="submitAuth()">Войти</button>
                <button class="btn-secondary" onclick="toggleAuthMode()">Создать аккаунт</button>
            </div>
        </div>
    </div>

    <!-- APP -->
    <div class="app" id="app">
        <!-- LEFT PANEL - CHAT LIST -->
        <aside class="chat-sidebar" id="chat-sidebar">
            <div class="sidebar-header">
                <div class="user-avatar" id="my-avatar">?</div>
                <div class="header-actions">
                    <button title="Nitro" onclick="switchView('nitro')">✨</button>
                    <button title="Магазин" onclick="switchView('shop')">🏪</button>
                    <button title="Задания" onclick="switchView('quests')">📋</button>
                </div>
            </div>
            
            <div class="search-box">
                <input type="text" placeholder="Поиск" onkeyup="searchChats(this.value)">
            </div>
            
            <div class="chat-list" id="chat-list">
                <div class="chat-item active" onclick="openChat('global')">
                    <div class="chat-avatar">🌍</div>
                    <div class="chat-info">
                        <div class="chat-name">Глобальный чат</div>
                        <div class="chat-last">Нажмите чтобы открыть чат</div>
                    </div>
                </div>
            </div>
            
            <div class="user-panel">
                <div class="user-info">
                    <div class="user-name" id="my-username">Гость</div>
                    <div class="user-stars" id="my-stars">⭐ 0</div>
                </div>
                <button class="admin-btn hidden" id="admin-btn" onclick="toggleAdmin()" title="Админка">⚙️</button>
            </div>
        </aside>

        <!-- MAIN CHAT AREA -->
        <main class="main-content">
            <!-- CHAT HEADER -->
            <header class="chat-header">
                <div class="chat-header-info">
                    <h3 id="chat-title">Глобальный чат</h3>
                    <span id="online-counter" class="online-counter">(0 онлайн)</span>
                </div>
                <div class="chat-header-actions">
                    <button onclick="toggleSidebar()">☰</button>
                </div>
            </header>

            <!-- PINNED MESSAGE -->
            <div class="pinned-bar hidden" id="pinned-bar">
                <span>📌 <span id="pinned-text"></span></span>
                <button onclick="unpinMessage()">✖</button>
            </div>

            <!-- MESSAGES -->
            <div class="messages-container" id="messages-container"></div>

            <!-- REPLY BAR -->
            <div class="reply-bar hidden" id="reply-bar">
                <span id="reply-info">Ответ...</span>
                <button onclick="cancelReply()">✖</button>
            </div>

            <!-- INPUT AREA -->
            <div class="input-area">
                <input type="file" id="file-input" accept="image/*" hidden>
                <button class="attach-btn" onclick="document.getElementById('file-input').click()">📎</button>
                <input type="text" id="message-input" placeholder="Напишите сообщение..." autocomplete="off">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </main>

        <!-- RIGHT PANEL - PROFILE/INFO -->
        <aside class="info-panel" id="info-panel">
            <div class="profile-section">
                <div class="profile-avatar-large">
                    <img src="" alt="avatar" id="profile-avatar-img">
                </div>
                <h3 id="profile-username">Пользователь</h3>
                <span class="profile-tag">Онлайн</span>
            </div>
            
            <div class="panel-section">
                <h4>Информация</h4>
                <div class="info-item">
                    <span>Звёзды:</span>
                    <span id="profile-stars">0 ⭐</span>
                </div>
                <div class="info-item">
                    <span>Nitro:</span>
                    <span id="profile-nitro">-</span>
                </div>
            </div>
            
            <div class="panel-section">
                <button class="btn-nitro" onclick="buyNitro()">Купить Nitro (500 ⭐)</button>
            </div>
        </aside>
    </div>

    <!-- ADMIN MODAL -->
    <div class="modal hidden" id="admin-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Админ панель</h3>
                <button onclick="toggleAdmin()">✖</button>
            </div>
            <button onclick="adminGetStars()">+1000 ⭐</button>
            <button class="danger" onclick="adminClearChat()">Очистить чат</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
